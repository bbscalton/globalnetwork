name: globalnetwork_customer
description: GlobalNetwork customer app — view subscription, chat, report issues with photos.
publish_to: "none"
version: 0.1.6+7

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.4
  google_sign_in: ^6.3.0
  cloud_firestore: ^5.6.0
  firebase_messaging: ^15.1.6
  cloud_functions: ^5.3.0
  http: ^1.2.2
  image_picker: ^1.1.2
  google_fonts: ^6.2.1
  record: ^6.2.1
  audioplayers: ^6.7.1
  video_player: ^2.11.1
  geolocator: ^13.0.4
  flutter_webrtc: ^0.12.12

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo-gn.png
