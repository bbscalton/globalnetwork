<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <base href="%BASE_URL%" />
    <link rel="icon" href="./logo-gn.png" />
    <link rel="manifest" href="./manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#050816" />
    <meta name="apple-mobile-web-app-title" content="GN POS" />
    <title>GlobalNetwork · Field POS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet" />
    <style>
      html, body, #root { min-height: 100%; margin: 0; background: #050816; color: #e2e8f0; font-family: Figtree, Segoe UI, sans-serif; }
      .boot { min-height: 100vh; display: grid; place-items: center; padding: 1.5rem; }
      .boot-panel { width: min(420px, 100%); display: grid; gap: 0.75rem; padding: 1.6rem; border-radius: 22px; border: 1px solid rgba(148,163,184,0.18); background: rgba(2,6,23,0.72); }
      .boot-panel h1 { font-family: Syne, Segoe UI, sans-serif; margin: 0; }
      .boot-panel .eyebrow { text-transform: uppercase; letter-spacing: 0.16em; font-size: 0.72rem; font-weight: 700; color: #22d3ee; margin: 0; }
      .boot-panel .muted { color: #94a3b8; margin: 0; }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot">
        <div class="boot-panel">
          <img src="./logo-gn.png" alt="GlobalNetwork" width="84" height="84" />
          <p class="eyebrow">GlobalNetwork · Antigua</p>
          <h1>Field POS</h1>
          <p class="muted">Staff sign-in required. Cashiers, owners, and managers collect EC$ after login.</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
