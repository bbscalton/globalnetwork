name: globalnetwork_customer
description: GlobalNetwork customer app — view subscription, chat, report issues with photos.
publish_to: "none"
version: 0.1.10+11

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.4
  google_sign_in: ^6.3.0
  cloud_firestore: ^5.6.0
  firebase_messaging: ^15.1.6
  cloud_functions: ^5.3.0
  http: ^1.2.2
  image_picker: ^1.1.2
  google_fonts: ^6.2.1
  record: ^6.2.1
  audioplayers: ^6.7.1
  video_player: ^2.11.1
  geolocator: ^13.0.4
  flutter_webrtc: ^0.12.12

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true
  assets:
    - assets/logo-gn.png

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
    image_path: assets/logo-gn.png
    background_color: "#050816"
    theme_color: "#050816"
  image_path: assets/logo-gn.png
  min_sdk_android: 24
  adaptive_icon_background: "#050816"
  adaptive_icon_foreground: assets/logo-gn.png
  adaptive_icon_foreground_inset: 8
  remove_alpha_ios: true
  background_color_ios: "#050816"

flutter_native_splash:
  color: "#050816"
  image: assets/logo-gn.png
  android: true
  ios: true
  web: false
  android_12:
    color: "#050816"
    image: assets/logo-gn.png
    icon_background_color: "#050816"
